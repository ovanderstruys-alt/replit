name: Build ProofTrack APK

# Trigger manually from the GitHub Actions tab (recommended)
# or automatically when android-wrapper code changes on main.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: >
          URL of your deployed ProofTrack app
          (e.g. https://prooftrack.replit.app/).
          Leave blank to use the APP_URL repository secret.
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['android-wrapper/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Code ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Toolchain ───────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── 3. Capacitor deps ──────────────────────────────────────────────────
      # Use `npm install` (not `npm ci`) so it works with or without a
      # pre-existing lock file and never fails on lock-file drift.
      - name: Install Capacitor dependencies
        working-directory: android-wrapper
        run: npm install

      # ── 4. Sync – bakes APP_URL into the Android assets ───────────────────
      # Call the binary directly (./node_modules/.bin/cap) instead of via npx
      # to avoid the "could not determine executable to run" npx resolution bug.
      - name: Sync Capacitor with app URL
        working-directory: android-wrapper
        env:
          # workflow_dispatch input takes priority; falls back to repo secret
          APP_URL: ${{ inputs.app_url || secrets.APP_URL }}
        run: ./node_modules/.bin/cap sync android

      # ── 5. Build ───────────────────────────────────────────────────────────
      - name: Make Gradle wrapper executable
        working-directory: android-wrapper/android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android-wrapper/android
        run: ./gradlew assembleDebug --no-daemon

      # ── 6. Publish artifact ────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProofTrack-debug
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
